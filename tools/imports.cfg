# Assassin's Creed: Altair's Chronicles HD: one module.
MODULES libassissinscreed.so

# The library is ARMv5 soft-float code (armeabi): its float and double
# arithmetic, long division and unwinding come from libgcc, which Android's libc
# exports for it. The toolchain's own libgcc has them, with the same ABI.
PASSTHROUGH __aeabi_d2f __aeabi_d2iz __aeabi_dadd __aeabi_ddiv __aeabi_dmul __aeabi_dsub
PASSTHROUGH __aeabi_f2iz __aeabi_fadd __aeabi_fcmpeq __aeabi_fcmpge __aeabi_fcmple __aeabi_fdiv __aeabi_fmul __aeabi_fsub
PASSTHROUGH __aeabi_i2d __aeabi_i2f __aeabi_ui2d __aeabi_ui2f
PASSTHROUGH __aeabi_ldivmod __aeabi_lmul __aeabi_uidiv __aeabi_uidivmod
PASSTHROUGH __aeabi_unwind_cpp_pr0 __aeabi_unwind_cpp_pr1
